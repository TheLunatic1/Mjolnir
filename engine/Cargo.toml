[package]
name = "mjolnir-engine"
version = "0.1.0"
edition = "2021"
authors = ["TheLunatic1 (Salman Toha)"]
license = "Apache-2.0"
description = "High-performance multi-protocol enterprise load testing engine binary"

[dependencies]
# Async Runtime & Utilities
tokio = { version = "1.37", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
bytes = "1.5"

# Web Server & WebSockets (IPC with Electron & Cluster)
axum = { version = "0.7", features = ["ws", "macros"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# HTTP/1.1 and HTTP/2
hyper = { version = "1.2", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots", "http2", "stream", "cookies"] }

# HTTP/3 / QUIC
quinn = "0.11"
rustls = { version = "0.23", features = ["ring"] }

# gRPC
tonic = "0.11"
prost = "0.12"

# Data & Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
regex = "1.10"
uuid = { version = "1.8", features = ["v4", "fast-rng", "serde"] }
rand = "0.8"

# Metrics & Histograms
hdrhistogram = { version = "7.5", features = ["sync"] }
chrono = { version = "0.4", features = ["serde"] }

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI Arguments
clap = { version = "4.5", features = ["derive"] }

# Networking protocols
tokio-util = { version = "0.7", features = ["codec"] }

[dev-dependencies]
tokio-test = "0.4"
